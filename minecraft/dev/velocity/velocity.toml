# Config version. Do not change this
config-version = "2.8"

# MagnaQore DEV proxy. Prod uses port 25565.
bind = "0.0.0.0:25566"

# MiniMessage format.
motd = "<gradient:#8A2BE2:#00CED1><b>MagnaQore</b></gradient> <dark_gray>|</dark_gray> <gray>dev-контур</gray>"

show-max-players = 100

# Offline-mode network: LibreLogin handles auth (register/login + premium auto-login),
# Floodgate handles Bedrock players. See docs/DECISIONS.md ADR-003.
online-mode = false

# Must be false for offline-mode clients (no signed chat keys).
force-key-authentication = false

prevent-client-proxy-connections = false

# Modern forwarding: backends receive real IP/UUID, protected by forwarding.secret.
player-info-forwarding-mode = "modern"
forwarding-secret-file = "forwarding.secret"

announce-forge = false
kick-existing-players = false
ping-passthrough = "DISABLED"
sample-players-in-ping = false
enable-player-address-logging = true

[packet-limiter]
interval = 7
packets-per-second = -1
bytes-per-second = -1
decompressed-bytes-per-second = 5242880

[servers]
# Backends are localhost-only; only the proxy is exposed.
limbo = "127.0.0.1:25590"
survival = "127.0.0.1:25592"

# LibreLogin routes unauthenticated players to "limbo" first.
try = [
    "survival"
]

[forced-hosts]

[advanced]
compression-threshold = 256
compression-level = -1
login-ratelimit = 3000
connection-timeout = 5000
read-timeout = 30000
haproxy-protocol = false
tcp-fast-open = false
bungee-plugin-message-channel = true
show-ping-requests = false
failover-on-unexpected-server-disconnect = true
announce-proxy-commands = true
log-command-executions = false
log-player-connections = true
accepts-transfers = false
enable-reuse-port = false
command-rate-limit = 50
forward-commands-if-rate-limited = true
kick-after-rate-limited-commands = 0
tab-complete-rate-limit = 10
kick-after-rate-limited-tab-completes = 0

[query]
enabled = false
port = 25566
map = "MagnaQore"
show-plugins = false
