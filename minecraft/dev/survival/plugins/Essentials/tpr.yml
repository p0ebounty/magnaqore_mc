# Configuration for the random teleport command.
# Some settings may be defaulted and can be changed using the '/settpr' command in-game.
default-location: '{world}'
excluded-biomes:
  - cold_ocean
  - deep_cold_ocean
  - deep_frozen_ocean
  - deep_lukewarm_ocean
  - deep_ocean
  - deep_warm_ocean
  - frozen_ocean
  - frozen_river
  - lukewarm_ocean
  - ocean
  - river
  - warm_ocean
locations:
  '{world}':
    center:
      world: world
      x: -29.0
      y: 200.0
      z: 91.0
      yaw: 0.0
      pitch: 0.0
    min-range: 300.0
    max-range: 4500.0
