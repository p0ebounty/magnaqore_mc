#
# NanoLimbo configuration — MagnaQore auth limbo (dev).
# Players wait here until they /login or /register (LibreLogin on the proxy).
# Secret is loaded from a file (@path) so this config is safe to commit.
#

bind:
  ip: "127.0.0.1"
  port: 25590

maxPlayers: -1

ping:
  description: "<gradient:#8A2BE2:#00CED1>MagnaQore</gradient> <gray>auth limbo</gray>"
  version: "MagnaQore"
  protocol: -1

dimension: THE_END

playerList:
  enable: false
  username: "MagnaQore"

headerAndFooter:
  enable: true
  header: "<gradient:#8A2BE2:#00CED1><b>MagnaQore</b></gradient>"
  footer: "<gray>Авторизация · Authorization</gray>"

# Spectator: hide UI bars while waiting for auth
gameMode: 3

secureProfile: false

brandName:
  enable: true
  content: "MagnaQore"

joinMessage:
  enable: true
  text: "<gray>Введите <aqua>/login <пароль></aqua> или <aqua>/register <пароль> <пароль></aqua><newline>Use <aqua>/login <password></aqua> or <aqua>/register <password> <password></aqua></gray>"

bossBar:
  enable: true
  text: "<white>Авторизация · Authorization — <aqua>MagnaQore</aqua>"
  health: 1.0
  color: PURPLE
  division: SOLID

title:
  enable: true
  title: "<gradient:#8A2BE2:#00CED1><b>MagnaQore</b></gradient>"
  subtitle: "<gray>/login · /register</gray>"
  fadeIn: 10
  stay: 100
  fadeOut: 10

# Modern Velocity forwarding; secret read from the proxy's file (kept out of git)
infoForwarding:
  type: MODERN
  secret: '@../velocity/forwarding.secret'

readTimeout: 30000
logPlayersIp: true
debugLevel: 2

netty:
  transportType: EPOLL
  threads:
    bossGroup: 1
    workerGroup: 4

# Basic packet-flood guard for the auth stage
traffic:
  enable: true
  maxPacketSize: 8192
  interval: 7.0
  maxPacketRate: 500.0
  maxPacketBytesRate: 2048.0
