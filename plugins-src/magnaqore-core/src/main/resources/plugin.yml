name: MagnaQoreCore
version: '${version}'
main: net.magnaqore.core.MagnaQoreCore
api-version: '1.21'
author: MagnaQore
description: MagnaQore network core - branded UI, RU/EN localization, spawn.
softdepend: [LuckPerms]
commands:
  spawn:
    description: Teleport to the server spawn / Телепорт на спавн
    usage: /spawn
  mqspawn:
    description: Rebuild the custom spawn plaza (dev tool)
    usage: /mqspawn build [x z]
    permission: magnaqore.dev
permissions:
  magnaqore.dev:
    description: MagnaQore dev tools
    default: op
